name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go test ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/goGTFO-linux-amd64 .
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/goGTFO-linux-arm64 .
